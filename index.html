<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI for Study, Work and Career</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
@font-face { font-family: "DM Sans"; src: url("DMSans.ttf") format("truetype"); font-weight: 100 1000; font-display: swap; }
@font-face { font-family: "Caveat"; src: url("Caveat.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }
:root {
  --canvas: #d8d8d4; --paper: #fbfbf8; --ink: #141414; --grey: #6b6b66; --line: #c9c9c3;
  --blue: #2346d8; --blue-soft: #9db0ff; --black: #000; --yellow: #f5d04a; --red: #d9432b; --good: #1f8a4c;
  --sans: "DM Sans", "Helvetica Neue", Arial, sans-serif; --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); font-family: var(--sans); color: var(--ink); }
#viewport { position: fixed; inset: 0; overflow: hidden; background: var(--canvas); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* ---------- overview ---------- */
.overview { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 50% 50%; }
.overview h1 { position: absolute; left: 70px; top: 70px; margin: 0; width: 820px; font-size: 80px; line-height: 1; letter-spacing: -0.03em; font-weight: 700; }
.overview .sub { position: absolute; left: 72px; top: 255px; margin: 0; font-size: 28px; color: var(--grey); }
.overview .by { position: absolute; left: 72px; top: 300px; margin: 0; font-size: 24px; font-weight: 700; }
.overview svg.map { position: absolute; inset: 0; width: 1600px; height: 900px; overflow: visible; }
.topic-label { position: absolute; background: #fff; border: 2px solid var(--ink); padding: 6px 14px 6px 8px; font-size: 24px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.topic-label .ic { width: 34px; height: 34px; font-size: 16px; }
.ov-hero { position: absolute; left: 1352px; top: 40px; width: 222px; height: 148px; }
.scene.ov-hero .tape { width: 70px; height: 18px; margin-left: -35px; top: -9px; }
.panel-label { position: absolute; font-family: var(--hand); color: var(--blue); font-size: 30px; }
.panel-label.light { color: var(--blue-soft); }

/* ---------- frames ---------- */
.card { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 50% 50%; background: var(--paper);
  border-radius: 10px; box-shadow: 0 40px 80px rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.08); overflow: hidden; padding: 84px 110px 120px; cursor: pointer; }
.card.dark { background: var(--black); color: #fff; }
.card h2 { margin: 0 0 40px; font-size: 76px; line-height: 1.02; letter-spacing: -0.028em; font-weight: 700; max-width: 1060px; }
.card h3 { margin: 0 0 6px; font-size: 36px; letter-spacing: -0.01em; }
.card p { margin: 0; }
.w900 { max-width: 820px !important; font-size: 92px !important; }
.muted { font-size: 28px; color: var(--grey); }
.dark .muted { color: #a3a3a3; }
.lead { font-size: 32px; line-height: 1.35; }
.big { font-size: 44px; font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; }
.hand { font-family: var(--hand); color: var(--blue); font-size: 46px; line-height: 1.05; font-weight: 600; }
.dark .hand { color: var(--blue-soft); }
.hand.xl { font-size: 62px; }
.mt { margin-top: 26px !important; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 20px; }
.col.center { align-items: center; text-align: center; }

/* icons */
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex: none; }
.ic { display: inline-grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; font-size: 32px; flex: none; }
.ic.sm { width: 46px; height: 46px; font-size: 21px; }
.ic.lg { width: 92px; height: 92px; font-size: 40px; }
.ic.xl { width: 120px; height: 120px; font-size: 54px; }
.ic.huge { width: 190px; height: 190px; font-size: 86px; }
.ic.blue { background: var(--blue); color: #fff; }
.ic.yellow { background: var(--yellow); color: var(--ink); }
.ic.ink { background: var(--ink); color: #fff; }
.ic.grey { background: #e3e3de; color: var(--grey); }
.ic.white { background: #fff; color: #000; }
.ic.off { background: #e6e6e1; color: #a2a29c; }

/* scenes: illustrations taped onto the card */
.scene { margin: 0; position: relative; border: 3px solid var(--ink); border-radius: 6px; overflow: visible; background: #eee;
  transform: rotate(var(--r, 0deg)); box-shadow: 10px 12px 0 rgba(0,0,0,.08); }
.scene svg { display: block; width: 100%; height: 100%; border-radius: 3px; }
.scene .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); border-radius: 3px; }
.scene .tape { position: absolute; top: -18px; left: 50%; width: 150px; height: 36px; margin-left: -75px; background: rgba(245, 208, 74, .78); transform: rotate(-3deg); }
.dark .scene { border-color: #fff; box-shadow: none; }
.s-md { width: 600px; height: 400px; }
.s-sm { width: 480px; height: 320px; }

/* chat */
.row { display: flex; align-items: flex-end; gap: 14px; }
.row.me { justify-content: flex-end; }
.av { display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; font-size: 26px; flex: none; }
.av-me { background: var(--yellow); color: var(--ink); }
.av-ai { background: var(--ink); color: #fff; }
.av-boss { background: #5d5d58; color: #fff; }
.bubble { font-size: 30px; line-height: 1.3; padding: 20px 28px; border-radius: 28px; max-width: 600px; }
.bubble.me { background: var(--blue); color: #fff; border-bottom-right-radius: 6px; }
.bubble.ai { background: #fff; border: 2.5px solid var(--ink); border-bottom-left-radius: 6px; }
.bubble.xl { font-size: 44px; font-weight: 600; line-height: 1.2; padding: 30px 36px; }
.who { display: block; font-size: 20px; font-weight: 700; color: var(--grey); margin-bottom: 4px; }
.thought { font-size: 30px; font-style: italic; color: var(--grey); line-height: 1.35; }
.thought .ico { color: var(--blue); margin-right: 8px; }
.done { font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 14px; }

/* chrome */
.tracker { position: absolute; top: 46px; right: 70px; display: flex; align-items: flex-start; }
.tk { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 19px; color: #9a9a94; }
.tk .ico { width: 58px; height: 58px; padding: 14px; border-radius: 50%; border: 2.5px solid #c4c4be; background: var(--paper); }
.tk.past { color: var(--ink); } .tk.past .ico { border-color: var(--blue); color: var(--blue); }
.tk.cur { color: var(--ink); font-weight: 700; } .tk.cur .ico { background: var(--blue); border-color: var(--blue); color: #fff; }
.tk-line { width: 26px; margin-top: 29px; border-top: 3px dashed #c4c4be; }
.dark .tk .ico { background: #000; border-color: #555; } .dark .tk { color: #888; }
.dark .tk.past, .dark .tk.cur { color: #fff; } .dark .tk.cur .ico { background: var(--blue); border-color: var(--blue); }
.qs { position: absolute; left: 110px; bottom: 36px; display: flex; gap: 30px; }
.qb { display: flex; align-items: center; gap: 12px; font-size: 24px; color: #a2a29c; }
.qb.on { color: var(--ink); font-weight: 700; }
.pill { position: absolute; right: 110px; bottom: 34px; display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 30px 0 24px; border-radius: 31px; font-size: 26px; font-weight: 700; }
.pill .ico { font-size: 26px; }
.p-think, .p-write, .p-ask { background: var(--yellow); color: var(--ink); }
.p-chat, .p-timer { background: var(--ink); color: #fff; }
.p-poll, .p-scan { background: var(--blue); color: #fff; }
.dark .p-chat, .dark .p-timer { background: #fff; color: #000; }
.rule { position: absolute; left: 110px; bottom: 34px; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 28px; background: var(--yellow); font-size: 28px; font-weight: 700; border-radius: 31px; }

/* specific frames */
.f1-asks { position: absolute; left: 110px; bottom: 140px; display: flex; flex-direction: column; gap: 6px; }
.who-line { display: flex; align-items: center; gap: 14px; font-size: 28px; color: #bbb; margin-bottom: 8px !important; }
.who-line .ic { width: 52px; height: 52px; font-size: 24px; }
.f1-asks .big { font-size: 48px; }
.f1-scene { position: absolute; right: 110px; top: 170px; width: 600px; height: 400px; }
.sticky { background: var(--yellow); color: var(--ink); padding: 20px 26px 26px; box-shadow: 8px 10px 0 rgba(0,0,0,.1); }
.sticky.grey { background: #ececE7; }
.sticky-t { font-size: 26px; font-weight: 700; }
.ln2 { display: block; height: 2px; background: rgba(0,0,0,.35); margin-top: 30px; }
.f1-sticky { position: absolute; right: 120px; top: 612px; width: 560px; transform: rotate(-1.5deg); }
.stops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px; margin: 6px 0 56px; position: relative; }
.stop { display: flex; gap: 24px; align-items: center; }
.stop .n { font-family: var(--hand); color: var(--blue); font-size: 40px; font-weight: 700; line-height: .9; }
.stop h3 { font-size: 44px; }
.stop p:last-child { font-size: 26px; color: var(--grey); line-height: 1.3; }
.qcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 14px; }
.qcard { background: #fff; border: 2.5px solid var(--ink); border-radius: 14px; padding: 24px 26px; display: flex; gap: 20px; align-items: center; box-shadow: 8px 8px 0 rgba(0,0,0,.06); }
.qcard p { font-size: 36px; font-weight: 700; line-height: 1.12; }
.dark3 .qcard { background: #141414; border-color: #444; color: #fff; box-shadow: none; }
.plan-note { margin-top: 22px !important; }
.pl { display: flex; gap: 18px; align-items: flex-start; font-size: 30px; line-height: 1.32; }
.pl .tag { display: block; font-size: 20px; font-weight: 700; color: var(--grey); }
.pl.grey p { color: #444; }
.frame-line { display: flex; align-items: baseline; gap: 14px; border-bottom: 2.5px dashed var(--line); padding-bottom: 8px; color: var(--blue); font-size: 26px; }
.chain { display: flex; align-items: center; gap: 6px; margin-top: 22px; }
.chain > div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 26px; font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px; margin-bottom: 36px; }
.step { position: relative; }
.step .num { position: absolute; left: 70px; top: -18px; font-size: 64px; line-height: 1; }
.step h3 { margin-top: 18px; }
.step p { font-size: 27px; line-height: 1.35; }
.slips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 46px; }
.slip { background: #fff; border: 2px solid var(--ink); padding: 20px 24px; font-size: 28px; font-weight: 600; line-height: 1.3; box-shadow: 6px 6px 0 rgba(0,0,0,.08); }
.slip > .ico { color: var(--blue); margin-right: 10px; font-size: 22px; }
.r1 { transform: rotate(-1.2deg); } .r2 { transform: rotate(.9deg); } .r3 { transform: rotate(-.5deg); }
.foot { margin-top: 34px !important; font-size: 26px; color: var(--grey); }
.index-card { background: #fff; border: 2px solid var(--ink); padding: 26px 32px 40px; transform: rotate(-1.5deg); font-size: 31px; line-height: 1.4; position: relative; box-shadow: 8px 8px 0 rgba(0,0,0,.08); margin-top: 10px; }
.index-card .stamp { position: absolute; right: 26px; bottom: -32px; transform: rotate(-6deg); font-size: 54px; background: var(--paper); padding: 0 10px; }
.doc { background: #fff; border: 2px solid var(--line); padding: 32px 38px; transform: rotate(-1deg); box-shadow: 0 16px 30px rgba(0,0,0,.08); }
.doc-title { font-size: 29px; font-weight: 700; margin-bottom: 20px !important; }
.doc-title .ico { color: var(--blue); margin-right: 8px; }
.ln { display: block; height: 12px; background: #e6e6e1; border-radius: 6px; margin-bottom: 15px; }
.ai-note { margin-top: 22px; background: #f0f2fb; border: 2px solid var(--blue); padding: 18px 22px; font-size: 26px; font-style: italic; line-height: 1.35; }
.ai-note .who { color: var(--blue); font-style: normal; }
.irow { display: flex; gap: 22px; align-items: center; font-size: 31px; line-height: 1.3; }
.back { font-size: 64px; font-weight: 700; margin-bottom: 14px !important; }
.blank { display: inline-block; width: 110px; border-bottom: 5px solid #fff; height: 52px; vertical-align: baseline; }
.think { position: absolute; left: 110px; right: 110px; bottom: 140px; font-size: 42px; font-weight: 700; line-height: 1.2; color: #fff; display: flex; gap: 24px; align-items: center; }
.form { background: #fff; border: 2px solid var(--ink); }
.form-head { background: var(--ink); color: #fff; font-size: 27px; font-weight: 700; padding: 18px 28px; }
.form-head .ico { margin-right: 10px; }
.form-q { font-size: 31px; font-weight: 700; padding: 24px 28px 14px; }
.form-field { margin: 0 28px; height: 150px; border: 2px solid #aaa; position: relative; }
.cursor { position: absolute; left: 20px; top: 20px; width: 3px; height: 40px; background: var(--ink); }
.form-btn { display: inline-block; margin: 20px 28px 24px; float: right; background: #e6e6e1; color: var(--grey); font-size: 23px; font-weight: 700; padding: 10px 26px; }
.ab { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; margin-top: 10px; }
.ab-col { display: flex; flex-direction: column; gap: 34px; }
.big-slip { font-size: 42px; line-height: 1.2; padding: 34px 40px; min-height: 260px; }
.letter { display: block; font-family: var(--hand); color: var(--blue); font-size: 66px; line-height: .9; margin-bottom: 8px; }
.prompt { font-size: 25px; font-style: italic; color: var(--grey); margin: -16px 0 22px !important; max-width: 1380px; }
.prompt .ico { color: var(--ink); margin-right: 8px; }
.f12 { display: grid; grid-template-columns: 1fr 480px; gap: 50px; }
.dialogue { display: flex; flex-direction: column; gap: 14px; }
.dialogue .bubble { font-size: 27px; padding: 14px 24px; max-width: 640px; }
.dialogue .av { width: 50px; height: 50px; font-size: 22px; }
.bubble.honest { outline: 4px solid var(--yellow); outline-offset: 4px; }
.f12-side { display: flex; flex-direction: column; gap: 26px; }
.honest-note { display: flex; align-items: flex-end; gap: 4px; margin-left: -20px; }
.flip { transform: scaleX(-1) rotate(-10deg); }
.step-row { display: grid; grid-template-columns: 72px 1fr; gap: 20px; margin-bottom: 24px; align-items: start; }
.step-row p { font-size: 27px; line-height: 1.3; }
.step-row h3 { font-size: 33px; }
.msg { background: #fff; border: 2px solid var(--ink); padding: 30px 34px; }
.msg-title { font-size: 29px; font-weight: 700; margin-bottom: 18px !important; }
.msg-title .ico { color: var(--blue); margin-right: 8px; }
.msg-row { display: grid; grid-template-columns: 190px 1fr 40px; gap: 12px; align-items: center; font-size: 25px; color: var(--grey); margin-bottom: 12px !important; }
.msg-row .ico { color: var(--red); font-size: 24px; }
.redact { display: block; height: 24px; background: var(--ink); }
.msg-body { margin-top: 22px !important; font-size: 36px; font-weight: 700; line-height: 1.2; }
.grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 34px 44px; }
.tile { font-size: 30px; min-height: 196px; }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.tile .letter { font-size: 56px; }
.draft { background: #fff; border: 2px solid var(--ink); padding: 30px 38px; transform: rotate(-1deg); box-shadow: 8px 8px 0 rgba(0,0,0,.06); }
.draft p { font-size: 42px; font-weight: 700; line-height: 1.2; }
.story { margin-top: 40px; }
.story-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 44px; margin-top: 12px; }
.story-row .slip { display: flex; align-items: center; gap: 16px; }
.f17-art { position: relative; margin-top: 10px; }
.clock-badge { position: absolute; right: -24px; bottom: -28px; background: var(--red); color: #fff; border-radius: 40px; padding: 12px 22px; font-size: 30px; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 0 rgba(0,0,0,.15); }
.down { margin: -6px 0 -6px 20px !important; font-size: 40px; }
.down .ico { font-size: 30px; }
.keep { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 60px; margin-top: 14px; }
.keep p { font-size: 30px; color: #e6e6e6; }
.keep .ico { color: var(--yellow); margin-right: 12px; font-size: 22px; }

/* activity frames */
.act { display: grid; grid-template-columns: 480px 1fr; gap: 90px; }
.act-left { display: flex; flex-direction: column; align-items: flex-start; }
.qr-wrap { position: relative; }
.qr { width: 440px; height: 440px; background: #fff; border: 3px solid var(--ink); padding: 16px; border-radius: 8px; }
.qr svg { width: 100%; height: 100%; display: block; }
.qr-badge { position: absolute; right: -26px; bottom: -26px; width: 84px; height: 84px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 40px; border: 5px solid var(--paper); }
.scan { font-size: 32px; font-weight: 700; margin-top: 26px !important; }
.url { font-size: 19px; color: var(--grey); word-break: break-all; margin-top: 6px !important; max-width: 440px; }
.anon { font-size: 21px; margin-top: 10px !important; }
.act-right { display: flex; flex-direction: column; padding-top: 4px; }
.kind { display: flex; align-items: center; gap: 16px; }
.kind .ic { width: 64px; height: 64px; font-size: 30px; }
.kind .hand { font-size: 52px; }
.act-q { font-size: 58px !important; margin: 18px 0 30px !important; max-width: 820px !important; }
.act-q .sub { display: block; font-size: 28px; font-weight: 500; color: var(--grey); letter-spacing: 0; margin-top: 10px; }
.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.res-row { display: grid; grid-template-columns: 1fr 90px; column-gap: 20px; row-gap: 8px; align-items: center; }
.res-text { font-size: 29px; font-weight: 600; line-height: 1.25; display: flex; gap: 14px; align-items: baseline; }
.qn { font-family: var(--hand); color: var(--blue); font-size: 40px; line-height: .8; }
.res-bar { grid-column: 1; height: 18px; background: #e8e8e3; border-radius: 9px; overflow: hidden; display: none; }
.res-bar span { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 9px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.res-pct { grid-column: 2; grid-row: 1 / span 2; font-size: 34px; font-weight: 700; text-align: right; display: none; }
.live .res.poll .res-bar, .live .res.poll .res-pct { display: block; }
.live.revealed .res.quiz .res-bar, .live.revealed .res.quiz .res-pct { display: block; }
.count { margin-top: 26px !important; font-size: 30px; font-weight: 700; display: none; align-items: center; gap: 12px; }
.count .ico { color: var(--blue); }
.live .count { display: flex; }
.hint { font-size: 34px; color: var(--grey); margin-top: 10px !important; display: none; }
.live:not(.revealed) .hint { display: none; }



/* quiz chart: right vs wrong per question */
.res.quiz { gap: 26px; }
.qrow { display: grid; grid-template-columns: 1fr auto; column-gap: 24px; row-gap: 10px; align-items: center; }
.qrow .res-text { grid-column: 1 / -1; }
.qbar { display: none; height: 26px; border-radius: 13px; overflow: hidden; background: #e8e8e3; }
.qbar span { display: block; float: left; height: 100%; width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.qbar .ok { background: var(--good); }
.qbar .bad { background: var(--red); }
.qnums { display: none; gap: 18px; font-size: 24px; color: var(--grey); white-space: nowrap; }
.qnums b { color: var(--ink); font-size: 28px; }
.n-ok .ico { color: var(--good); } .n-bad .ico { color: var(--red); }
.live .qbar { display: block; } .live .qnums { display: flex; }
.qans { grid-column: 1 / -1; display: none; font-size: 24px; font-weight: 700; color: var(--good); margin-top: -2px !important; }
.qans .ico { margin-right: 6px; }
.revealed .qans { display: block; }

/* online: copy link + AI interviewer chat window */
.copy-link { margin-top: 14px; display: inline-flex; align-items: center; gap: 12px; font: 700 24px/1 var(--sans); padding: 14px 22px; border-radius: 30px;
  border: 2.5px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
.copy-link:hover, .copy-link:focus-visible { background: var(--yellow); outline: none; }
.chatwin { background: #fff; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 10px 12px 0 rgba(0,0,0,.08); }
.chatwin-bar { background: var(--ink); color: #fff; font-size: 26px; font-weight: 700; padding: 16px 24px; display: flex; gap: 14px; align-items: center; }
.chatwin-body { padding: 24px 22px 28px; display: flex; flex-direction: column; gap: 16px; }
.chatwin .bubble { font-size: 25px; padding: 14px 22px; max-width: 520px; }
.chatwin .av { width: 48px; height: 48px; font-size: 21px; }

/* countdown timers */
.timer-box { position: absolute; right: 110px; bottom: 34px; display: flex; align-items: center; gap: 12px; }
.timer-box .pill { position: relative; right: auto; bottom: auto; border: 0; font-family: inherit; cursor: pointer; overflow: hidden; }
.timer-pill .pl-time { display: none; font-variant-numeric: tabular-nums; font-size: 34px; letter-spacing: -0.01em; min-width: 92px; text-align: center; }
.timer-pill .pl-act { display: flex; align-items: center; gap: 8px; margin-left: 6px; padding: 7px 16px 7px 13px; border-radius: 20px; background: rgba(255,255,255,.22); font-size: 22px; }
.p-think .pl-act, .p-write .pl-act, .p-ask .pl-act { background: rgba(0,0,0,.12); }
.timer-pill .pl-act .ico { font-size: 16px; }
.timer-pill .pl-prog { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: currentColor; opacity: .55; }
.timer-pill:focus-visible, .pl-reset:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }
.timer-pill.running .pl-label, .timer-pill.paused .pl-label, .timer-pill.done .pl-label { display: none; }
.timer-pill.running .pl-time, .timer-pill.paused .pl-time, .timer-pill.done .pl-time { display: block; }
.timer-pill.running, .timer-pill.paused, .timer-pill.done { height: 80px; border-radius: 40px; padding: 0 22px 0 26px; }
.timer-pill.running .pl-time, .timer-pill.paused .pl-time { font-size: 50px; min-width: 130px; }
.timer-pill.done .pl-time { font-size: 36px; }
.timer-pill.low { background: var(--red) !important; color: #fff !important; }
.timer-pill.done { background: var(--red) !important; color: #fff !important; animation: tpulse 1s ease-in-out 3; }
@keyframes tpulse { 50% { transform: scale(1.08); } }
.pl-reset { display: none; width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid currentColor; background: transparent; color: var(--grey); font-size: 20px; cursor: pointer; place-items: center; }
.dark .pl-reset { color: #bbb; }
.timer-box.active .pl-reset { display: grid; }
#mini { position: fixed; top: 16px; left: 16px; z-index: 10; display: none; align-items: center; gap: 10px; background: #141414; color: #fff; border: 0;
  border-radius: 999px; padding: 8px 16px 8px 12px; font: 600 15px/1 var(--sans); cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
#mini b { font-size: 18px; font-variant-numeric: tabular-nums; }
#mini.low { background: var(--red); }
#mini .ico { width: 18px; height: 18px; }
@media (prefers-reduced-motion: reduce) { .timer-pill.done { animation: none; } }

/* ---------- controls ---------- */
#bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: rgba(20,20,20,.88);
  color: #fff; padding: 6px; border-radius: 999px; transition: opacity .3s; z-index: 10; font-size: 14px; }
#bar.hide { opacity: 0; pointer-events: none; }
#bar button { background: none; border: 0; color: #fff; font: inherit; padding: 8px 14px; border-radius: 999px; cursor: pointer; }
#bar button:hover, #bar button:focus-visible { background: rgba(255,255,255,.16); outline: none; }
#bar .count-step { padding: 0 10px; opacity: .75; font-variant-numeric: tabular-nums; }
#notes { position: fixed; right: 0; top: 0; bottom: 0; width: min(440px, 90vw); background: #fff; box-shadow: -10px 0 30px rgba(0,0,0,.15); padding: 24px 26px 90px; overflow: auto; transform: translateX(105%); transition: transform .3s; z-index: 11; font-size: 16px; line-height: 1.5; }
#notes.open { transform: none; }
#notes h4, .pv h4 { margin: 0 0 4px; font-size: 20px; }
.nl { margin: 12px 0 0; }
.nl b { display: inline-block; min-width: 74px; font-size: 12px; letter-spacing: .04em; color: #0b6b5f; }
.nl b.DO, .nl b.NOTE { color: #9a5b00; }
.nl b.ON { color: #666; }
#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #fff3d6; border: 1px solid #e0b860; color: #5a4100; padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 12; max-width: 90vw; display: none; }
#help { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 13; }
#help div { background: #fff; padding: 28px 32px; border-radius: 12px; font-size: 16px; line-height: 1.8; max-width: 92vw; }
#help kbd { display: inline-block; min-width: 26px; text-align: center; border: 1px solid #bbb; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-family: inherit; font-size: 14px; margin-right: 8px; }

/* ---------- presenter view ---------- */
body.presenter { overflow: auto; background: #f4f4f1; }
.pv { display: grid; grid-template-columns: 1fr 320px; gap: 24px; padding: 24px; min-height: 100vh; font-size: 19px; line-height: 1.55; }
.pv-main { background: #fff; border-radius: 12px; padding: 26px 30px; }
.pv-side { display: flex; flex-direction: column; gap: 16px; }
.pv-box { background: #fff; border-radius: 12px; padding: 18px 20px; }
.pv-timer { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pv-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pv-btns button { font: inherit; font-size: 17px; padding: 14px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
.pv-btns button.primary { background: #141414; color: #fff; border-color: #141414; grid-column: span 2; }
.pv-meta { color: #666; font-size: 15px; }
@media (prefers-reduced-motion: reduce) { .res-bar span { transition: none; } }
</style>

<body>
<div id="viewport"><div id="world"></div></div>
<div id="bar" role="toolbar" aria-label="Presentation controls">
  <button id="bPrev" aria-label="Previous">◀</button>
  <span class="count-step" id="stepCount">1 / 1</span>
  <button id="bNext" aria-label="Next">▶</button>
  <button id="bOver">Overview</button>
  <button id="bNotes">Notes</button>
  <button id="bPres">Presenter view</button>
  <button id="bFull">Full screen</button>
  <button id="bHelp" aria-label="Keyboard shortcuts">?</button>
</div>
<aside id="notes" aria-label="Presenter notes"></aside>
<button id="mini" type="button" aria-label="Running timer. Go to its slide."></button>
<div id="toast" role="status"></div>
<div id="help"><div>
  <b>Keyboard shortcuts</b><br>
  <kbd>→</kbd><kbd>Space</kbd>Next &nbsp; <kbd>←</kbd>Previous<br>
  <kbd>O</kbd>Overview &nbsp; <kbd>N</kbd>Notes on this screen<br>
  <kbd>P</kbd>Presenter view in a new window<br>
  <kbd>R</kbd>Show quiz results &nbsp; <kbd>F</kbd>Full screen<br>
  <kbd>T</kbd>Start or pause the timer &nbsp; <kbd>Shift</kbd><kbd>T</kbd>Reset it<br>
  Click any card in the overview to jump to it.
</div></div>

<script>/* always load the newest settings, never a cached copy */ document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
<script src="activities.js"></script>
<script src="notes.js"></script>
<script src="qrcode.js"></script>
<script src="icons.js"></script>
<script src="scenes.js"></script>
<script src="live.js"></script>
<script src="deck-frames.js"></script>
<script>
(function () {
  const { F, roughEllipse, chrome, ic, scene, fmt, ico } = window.DECK;
  const cfg = window.SESSION_CONFIG || {};
  const U = 10; // world units per overview pixel
  const CARD = 80; // card width in overview pixels

  // ---------- layout (overview pixels, 1600 × 900) ----------
  const PLACE = {
    f1: [1030, 118, -0.8], f2: [1124, 118, 0.6], poll1: [1218, 118, -0.4],
    f3: [198, 480, -0.6], f4: [290, 480, 0.7], f5: [382, 480, -0.3],
    f6: [198, 537, 0.5], f7: [290, 537, -0.8], f8: [382, 537, 0.4],
    quiz1: [290, 594, -0.4],
    f10: [768, 559, -0.5], f11: [860, 559, 0.6], poll2: [952, 559, -0.3],
    f12: [814, 616, 0.4], f13: [906, 616, -0.6],
    f14: [1169, 419, 0.5], f15: [1261, 419, -0.4], f16: [1169, 476, -0.7], quiz2: [1261, 476, 0.4],
    f17: [1184, 778, -0.5], f18: [1294, 778, 0.6], poll3: [1404, 778, -0.4],
  };
  const TOPICS = {
    "@study": { c: [330, 548], r: 196, label: "University studies", lx: 220, ly: 760, icon: "FaGraduationCap" },
    "@apply": { c: [900, 612], r: 178, label: "Internship application", lx: 780, ly: 392, icon: "FaFileAlt" },
    "@work": { c: [1255, 470], r: 166, label: "First job", lx: 1180, ly: 262, icon: "FaHotel" },
  };
  const STEPS = ["overview", "f1", "f2", "poll1", "overview", "@study", "f3", "f4", "f5", "f6", "f7", "f8", "quiz1",
    "overview", "@apply", "f10", "f11", "poll2", "f12", "f13", "overview", "@work", "f14", "f15", "f16", "quiz2",
    "overview", "f17", "f18", "poll3", "overview"];

  const notesFor = (id) => (window.NOTES[id] || window.NOTES[(id.startsWith("@") ? "overview" : id)] || { title: id, lines: [] });
  const titleFor = (id) => id === "overview" ? "Overview" : id.startsWith("@") ? TOPICS[id].label : notesFor(id).title;

  // ---------- presenter view ----------
  const params = new URLSearchParams(location.search);
  const chan = "BroadcastChannel" in window ? new BroadcastChannel("ai-session-deck") : null;
  if (params.get("view") === "presenter") { presenterView(); return; }

  // ---------- build world ----------
  const world = document.getElementById("world");
  const ov = document.createElement("div");
  ov.className = "overview";
  ov.style.transform = `translate(${8000 - 800}px, ${4500 - 450}px) scale(${U})`;
  const circles = Object.entries(TOPICS).map(([k, t], i) =>
    `<circle cx="${t.c[0]}" cy="${t.c[1]}" r="${t.r}" fill="#ecece8" stroke="none"/>
     <path d="${roughEllipse(t.c[0], t.c[1], t.r, t.r, 11 + i, 0.008)}" stroke="#2346d8" stroke-width="2" fill="none"/>
     <path d="${roughEllipse(t.c[0], t.c[1], t.r + 6, t.r + 3, 31 + i, 0.012)}" stroke="#2346d8" stroke-width="1" fill="none" opacity=".6"/>`).join("");
  ov.innerHTML = `
    <svg class="map" viewBox="0 0 1600 900" aria-hidden="true">
      <path d="M1170,172 C980,300 470,250 330,548 S700,420 900,612 S1130,380 1255,470 S1330,690 1350,800"
        stroke="#2346d8" stroke-width="2" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
      <rect x="1010" y="86" width="310" height="104" rx="14" fill="#ecece8"/>
      ${circles}
      <rect x="1160" y="728" width="350" height="122" rx="14" fill="#141414"/>
    </svg>
    <h1>AI for Study, Work and Career</h1>
    <p class="sub">One student, three situations, three questions</p>
    <p class="by">Rawal Karim</p>
    <span class="panel-label" style="left:1022px;top:50px">Welcome</span>
    <span class="panel-label light" style="left:1176px;top:732px">Wrap-up</span>
    ${Object.values(TOPICS).map((t) => `<span class="topic-label" style="left:${t.lx}px;top:${t.ly}px">${ic(t.icon, "blue")}${t.label}</span>`).join("")}
    ${scene("desk", "ov-hero", 2)}`;
  world.appendChild(ov);

  const frames = {};
  for (const [id, [ox, oy, rot]] of Object.entries(PLACE)) {
    const el = document.createElement("section");
    const def = F[id];
    el.className = "card" + (def.dark ? " dark" : "");
    el.innerHTML = def.html + chrome(def);
    el.dataset.id = id;
    el.setAttribute("aria-label", titleFor(id));
    const s = (CARD * U) / 1600, cx = ox * U + 800 * s, cy = oy * U + 450 * s;
    el.style.transform = `translate(${cx - 800}px, ${cy - 450}px) rotate(${rot}deg) scale(${s})`;
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = STEPS.indexOf(id);
      if (STEPS[step] === id) {
        if (e.target.closest(".copy-link")) copyLink(e.target.closest(".copy-link"));
        else if (e.target.closest(".timer-pill")) toggleTimer(id);
        else if (e.target.closest(".pl-reset")) resetTimer(id);
        return;
      }
      if (i >= 0) go(i);
    });
    world.appendChild(el);
    frames[id] = { el, cx, cy, w: 1600 * s, h: 900 * s };
  }

  // ---------- QR codes + live results ----------
  const placeholderBase = "https://YOUR-USERNAME.github.io/YOUR-REPO/";
  const base = cfg.siteUrl ? cfg.siteUrl.replace(/\/?$/, "/") : (location.protocol.startsWith("http") ? new URL(".", location.href).href : placeholderBase);
  const joinUrl = (id) => `${base}join.html?a=${id}&s=${encodeURIComponent(window.Live.session)}`;
  document.querySelectorAll("[data-qr]").forEach((box) => {
    const url = joinUrl(box.dataset.qr);
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    box.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    box.closest(".act-left").querySelector("[data-url]").textContent = url.replace(/^https?:\/\//, "");
  });
  function copyLink(btn) {
    const url = joinUrl(btn.dataset.copy), label = btn.querySelector("span");
    const done = () => { label.textContent = "Copied. Paste it in the Meet chat"; setTimeout(() => (label.textContent = "Copy link for the chat"), 2500); };
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(done).catch(() => { window.prompt("Copy this link:", url); });
  }
  if (base === placeholderBase) toast("The QR codes point to a placeholder address. Present from your GitHub Pages site, or set siteUrl in config.js.");

  if (window.Live.enabled) {
    document.querySelectorAll(".act").forEach((act) => {
      act.classList.add("live");
      const id = act.dataset.activity, a = window.ACTIVITIES[id];
      window.Live.listen(id, (responses) => {
        const n = responses.length;
        act.querySelector(".count span").textContent = n === 1 ? "1 answer" : `${n} answers`;
        if (a.type === "quiz") {
          act.querySelectorAll(".qrow").forEach((row, i) => {
            const ok = responses.filter((r) => r[i] === a.questions[i].correct).length;
            const answered = responses.filter((r) => r[i] !== undefined && r[i] !== null).length;
            const bad = answered - ok;
            row.querySelector(".ok").style.width = (answered ? (100 * ok) / answered : 0) + "%";
            row.querySelector(".bad").style.width = (answered ? (100 * bad) / answered : 0) + "%";
            row.querySelector(".n-ok b").textContent = ok;
            row.querySelector(".n-bad b").textContent = bad;
          });
          return;
        }
        act.querySelectorAll(".res-row").forEach((row, i) => {
          let pct = 0;
          if (n) {
            if (a.type === "poll") pct = responses.filter((r) => r[0] === i).length / n;
            else pct = responses.filter((r) => r[i] === a.questions[i].correct).length / n;
          }
          row.querySelector(".res-bar span").style.width = Math.round(pct * 100) + "%";
          row.querySelector(".res-pct").textContent = Math.round(pct * 100) + "%";
        });
      }).then((ok) => { if (!ok) toast("Live results couldn’t connect. Check the Firebase settings in config.js."); });
    });
  }


  // ---------- countdown timers ----------
  const timers = {}; // id -> { total, left, endAt, state: idle | running | paused | done }
  Object.keys(frames).forEach((id) => { if (F[id].timer) timers[id] = { total: F[id].timer, left: F[id].timer, endAt: 0, state: "idle" }; });
  const timerLabel = (id) => (window.NOTES[id] && window.NOTES[id].title) || id;
  function toggleTimer(id) {
    const t = timers[id]; if (!t) return;
    if (t.state === "running") { t.left = Math.max(0, (t.endAt - Date.now()) / 1000); t.state = "paused"; }
    else if (t.state === "done") { t.left = t.total; t.state = "idle"; }
    else { if (t.state === "idle") t.left = t.total; t.endAt = Date.now() + t.left * 1000; t.state = "running"; unlockAudio(); }
    paintTimer(id); broadcast();
  }
  function resetTimer(id) { const t = timers[id]; if (!t) return; t.left = t.total; t.state = "idle"; paintTimer(id); broadcast(); }
  function paintTimer(id) {
    const t = timers[id], pill = frames[id].el.querySelector(".timer-pill"); if (!pill) return;
    const left = t.state === "running" ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.left;
    pill.classList.remove("idle", "running", "paused", "done");
    pill.classList.add(t.state);
    pill.classList.toggle("low", t.state === "running" && left <= 10);
    pill.querySelector(".pl-time").textContent = t.state === "done" ? "Time’s up" : fmt(Math.ceil(left));
    const act = pill.querySelector(".pl-act");
    act.innerHTML = t.state === "running" ? `${ico("FaPause")}<b>Pause</b>` : t.state === "paused" ? `${ico("FaPlay")}<b>Resume</b>` : t.state === "done" ? `${ico("FaUndo")}<b>Again</b>` : `${ico("FaPlay")}<b>Start</b>`;
    pill.querySelector(".pl-prog").style.width = t.state === "idle" ? "0" : (100 * (1 - left / t.total)).toFixed(2) + "%";
    pill.setAttribute("aria-label", t.state === "running" ? `Pause timer, ${fmt(Math.ceil(left))} left` : t.state === "paused" ? "Resume timer" : t.state === "done" ? "Time’s up. Start again" : `Start ${fmt(t.total)} timer`);
    pill.parentElement.classList.toggle("active", t.state !== "idle");
  }
  function tick() {
    let mini = null;
    for (const [id, t] of Object.entries(timers)) {
      if (t.state !== "running") continue;
      const left = (t.endAt - Date.now()) / 1000;
      if (left <= 0) { t.left = 0; t.state = "done"; chime(); broadcast(); }
      paintTimer(id);
      if (t.state === "running" && STEPS[step] !== id) mini = { id, left };
    }
    const m = document.getElementById("mini");
    if (mini) {
      m.style.display = "flex"; m.classList.toggle("low", mini.left <= 10);
      m.innerHTML = `${ico("FaStopwatch")}<span>${timerLabel(mini.id)}</span><b>${fmt(Math.ceil(mini.left))}</b>`;
      m.onclick = () => go(STEPS.indexOf(mini.id));
    } else m.style.display = "none";
    if (chan && Object.values(timers).some((t) => t.state === "running")) broadcastTimer();
  }
  setInterval(tick, 250);
  function timerState(id) {
    const t = timers[id]; if (!t) return null;
    return { state: t.state, left: t.state === "running" ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.left, total: t.total };
  }
  function broadcastTimer() { chan?.postMessage({ type: "timer", timer: timerState(STEPS[step]) }); }
  // a soft two-note chime when time is up (turn off with timerSound: false in config.js)
  let actx = null;
  function unlockAudio() { if (cfg.timerSound === false || actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  function chime() {
    if (!actx) return;
    [0, 0.28].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i ? 660 : 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d + 0.6);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.65);
    });
  }

  // ---------- camera ----------
  const view = { cx: 8000, cy: 4500, z: 0.1 };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function targetFor(id) {
    const vw = innerWidth, vh = innerHeight;
    let cx, cy, w, h, m;
    if (id === "overview") { cx = 8000; cy = 4500; w = 16000; h = 9000; m = 0.98; }
    else if (id.startsWith("@")) { const t = TOPICS[id]; cx = t.c[0] * U; cy = t.c[1] * U; w = h = (t.r * 2 + 40) * U; m = 0.92; }
    else { const f = frames[id]; cx = f.cx; cy = f.cy; w = f.w; h = f.h; m = 0.88; }
    return { cx, cy, z: Math.min(vw / w, vh / h) * m };
  }
  function apply(v) {
    world.style.transform = `translate(${innerWidth / 2}px, ${innerHeight / 2}px) scale(${v.z}) translate(${-v.cx}px, ${-v.cy}px)`;
  }
  let anim = null;
  function flyTo(t) {
    if (anim) cancelAnimationFrame(anim);
    const a = { ...view };
    if (reduce) { Object.assign(view, t); apply(view); return; }
    const vw = innerWidth, vh = innerHeight;
    const uw = Math.max(a.cx + vw / a.z / 2, t.cx + vw / t.z / 2) - Math.min(a.cx - vw / a.z / 2, t.cx - vw / t.z / 2);
    const uh = Math.max(a.cy + vh / a.z / 2, t.cy + vh / t.z / 2) - Math.min(a.cy - vh / a.z / 2, t.cy - vh / t.z / 2);
    const zFit = Math.min(vw / uw, vh / uh) * 0.9;
    const bump = Math.max(0, Math.log(Math.min(a.z, t.z)) - Math.log(zFit));
    const la = Math.log(a.z), lt = Math.log(t.z);
    const dur = 900 + Math.min(900, bump * 450 + Math.abs(lt - la) * 180);
    const t0 = performance.now();
    const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    (function frame(now) {
      const p = Math.min(1, (now - t0) / dur), e = ease(p);
      view.cx = a.cx + (t.cx - a.cx) * e;
      view.cy = a.cy + (t.cy - a.cy) * e;
      view.z = Math.exp(la + (lt - la) * e - bump * Math.sin(Math.PI * e));
      apply(view);
      if (p < 1) anim = requestAnimationFrame(frame); else anim = null;
    })(t0);
  }

  // ---------- navigation ----------
  let step = Math.min(STEPS.length - 1, Math.max(0, parseInt(location.hash.slice(1), 10) || 0));
  function go(i, instant) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    const id = STEPS[step], t = targetFor(id);
    if (instant) { Object.assign(view, t); apply(view); } else flyTo(t);
    document.getElementById("stepCount").textContent = `${step + 1} / ${STEPS.length}`;
    document.querySelectorAll(".card").forEach((c) => c.classList.toggle("current", c.dataset.id === id));
    history.replaceState(null, "", "#" + step);
    if (cfg.autoStartTimers && !instant && timers[id] && timers[id].state === "idle") setTimeout(() => { if (STEPS[step] === id && timers[id].state === "idle") toggleTimer(id); }, 1200);
    renderNotes();
    broadcast();
  }
  const next = () => go(step + 1), prev = () => go(step - 1);
  function reveal() {
    const id = STEPS[step], f = frames[id];
    if (f) f.el.querySelector(".act")?.classList.toggle("revealed");
    broadcast();
  }
  function renderNotes() {
    const id = STEPS[step], n = notesFor(id);
    document.getElementById("notes").innerHTML = `<h4>${titleFor(id)}</h4><p class="pv-meta">${n.time ? n.time + " min" : ""}</p>` +
      (id.startsWith("@") ? `<p class="nl">Zooming into this part. Press → for the first slide.</p>` : n.lines.map(([l, t]) => `<p class="nl"><b class="${l.split(" ")[0]}">${l}</b> ${t}</p>`).join(""));
  }
  function broadcast() {
    const id = STEPS[step], act = frames[id]?.el.querySelector(".act");
    chan?.postMessage({ type: "state", step, total: STEPS.length, id, next: STEPS[step + 1] || null, revealed: !!act?.classList.contains("revealed"), activity: !!act, timer: timerState(id) });
  }
  chan && (chan.onmessage = (e) => {
    const m = e.data;
    if (m.type === "next") next(); else if (m.type === "prev") prev();
    else if (m.type === "go") go(m.step); else if (m.type === "reveal") reveal(); else if (m.type === "hello") broadcast();
    else if (m.type === "timer") toggleTimer(STEPS[step]); else if (m.type === "timerReset") resetTimer(STEPS[step]);
  });

  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "o" || k === "O") goOverview();
    else if (k === "n" || k === "N") document.getElementById("notes").classList.toggle("open");
    else if (k === "p" || k === "P") openPresenter();
    else if (k === "r" || k === "R") reveal();
    else if (k === "T") resetTimer(STEPS[step]);
    else if (k === "t") toggleTimer(STEPS[step]);
    else if (k === "f" || k === "F") fullscreen();
    else if (k === "?") toggleHelp();
    else if (k === "Escape") { document.getElementById("help").style.display = "none"; document.getElementById("notes").classList.remove("open"); }
  });
  function openPresenter() { window.open(location.pathname + "?view=presenter", "presenter", "width=1100,height=720"); }
  function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
  function toggleHelp() { const h = document.getElementById("help"); h.style.display = h.style.display === "grid" ? "none" : "grid"; }
  document.getElementById("help").onclick = toggleHelp;
  document.getElementById("bPrev").onclick = prev;
  document.getElementById("bNext").onclick = next;
  function goOverview() { const i = STEPS.indexOf("overview", step); go(i >= 0 ? i : STEPS.length - 1); }
  document.getElementById("bOver").onclick = goOverview;
  document.getElementById("bNotes").onclick = () => document.getElementById("notes").classList.toggle("open");
  document.getElementById("bPres").onclick = openPresenter;
  document.getElementById("bFull").onclick = fullscreen;
  document.getElementById("bHelp").onclick = toggleHelp;

  // auto-hide controls
  const bar = document.getElementById("bar"); let hideT;
  function poke() { bar.classList.remove("hide"); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.add("hide"), 2500); }
  addEventListener("mousemove", poke); poke();

  addEventListener("resize", () => go(step, true));
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => (t.style.display = "none"), 9000); }
  go(step, true);

  function presenterView() {} // the presenter window is built by the next script
})();
</script>
<script>
// Presenter view: opened with ?view=presenter, controls the main window through BroadcastChannel.
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get("view") !== "presenter") return;
  document.body.className = "presenter";
  document.body.innerHTML = `
    <div class="pv">
      <div class="pv-main"><p class="pv-meta" id="pvStep">Waiting for the slides window…</p><h4 id="pvTitle"></h4><div id="pvNotes"></div></div>
      <div class="pv-side">
        <div class="pv-box"><p class="pv-meta">Elapsed</p><p class="pv-timer" id="pvTimer">00:00</p><button id="pvReset" style="font:inherit;font-size:14px;border:0;background:none;color:#0b6b5f;cursor:pointer;padding:0">Restart timer</button></div>
        <div class="pv-box" id="pvTimerBox"><p class="pv-meta">Slide timer</p><p class="pv-timer" id="pvCount">–</p>
          <div class="pv-btns" style="margin-top:8px"><button id="pvTStart">Start</button><button id="pvTReset">Reset</button></div></div>
        <div class="pv-box pv-btns"><button id="pvPrev">◀ Previous</button><button id="pvReveal">Show results</button><button class="primary" id="pvNext">Next ▶</button></div>
        <div class="pv-box"><p class="pv-meta">Next</p><p id="pvNext2" style="font-weight:700;margin:4px 0 0"></p></div>
        <p class="pv-meta">Keep the slides window on the shared screen. Arrow keys work here too.</p>
      </div>
    </div>`;
  const chan = new BroadcastChannel("ai-session-deck");
  const NOTES = window.NOTES;
  const label = (id) => !id ? "End" : id === "overview" ? "Overview" : id.startsWith("@") ? "Zoom into " + id.slice(1) : (NOTES[id]?.title || id);
  let t0 = Date.now();
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById("pvTimer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }, 500);
  document.getElementById("pvReset").onclick = () => (t0 = Date.now());
  chan.onmessage = (e) => {
    const m = e.data;
    if (m.type === "timer") { paintTimer(m.timer); return; }
    if (m.type !== "state") return;
    const n = NOTES[m.id] || NOTES.overview;
    document.getElementById("pvStep").textContent = `Step ${m.step + 1} of ${m.total}` + (n.time && !m.id.startsWith("@") ? ` · ${n.time} min` : "");
    document.getElementById("pvTitle").textContent = label(m.id);
    document.getElementById("pvNotes").innerHTML = m.id.startsWith("@") ? `<p class="nl">Zooming into this part. Press Next for the first slide.</p>` :
      n.lines.map(([l, t]) => `<p class="nl"><b class="${l.split(" ")[0]}">${l}</b> ${t}</p>`).join("");
    document.getElementById("pvNext2").textContent = label(m.next);
    const rb = document.getElementById("pvReveal"); rb.disabled = !m.activity; rb.textContent = m.revealed ? "Hide results" : "Show results";
    paintTimer(m.timer);
  };
  function paintTimer(t) {
    const c = document.getElementById("pvCount"), b = document.getElementById("pvTStart"), r = document.getElementById("pvTReset");
    if (!t) { c.textContent = "No timer on this slide"; c.style.fontSize = "17px"; b.disabled = r.disabled = true; return; }
    const left = Math.ceil(t.left);
    c.style.fontSize = ""; c.style.color = t.state === "done" || (t.state === "running" && left <= 10) ? "#d9432b" : "";
    c.textContent = t.state === "done" ? "Time’s up" : `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    b.disabled = r.disabled = false;
    b.textContent = t.state === "running" ? "Pause" : t.state === "paused" ? "Resume" : t.state === "done" ? "Start again" : "Start";
  }
  const send = (type) => chan.postMessage({ type });
  document.getElementById("pvNext").onclick = () => send("next");
  document.getElementById("pvPrev").onclick = () => send("prev");
  document.getElementById("pvReveal").onclick = () => send("reveal");
  document.getElementById("pvTStart").onclick = () => send("timer");
  document.getElementById("pvTReset").onclick = () => send("timerReset");
  addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); send("next"); }
    else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); send("prev"); }
    else if (e.key === "r" || e.key === "R") send("reveal");
    else if (e.key === "T") send("timerReset");
    else if (e.key === "t") send("timer");
  });
  send("hello");
})();
</script>
