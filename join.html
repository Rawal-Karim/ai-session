<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join the session</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
@font-face { font-family: "DM Sans"; src: url("DMSans.ttf") format("truetype"); font-weight: 100 1000; font-display: swap; }
@font-face { font-family: "Caveat"; src: url("Caveat.ttf") format("truetype"); font-weight: 400 700; font-display: swap; }
:root { --canvas: #d8d8d4; --paper: #fbfbf8; --ink: #141414; --grey: #6b6b66; --line: #c9c9c3; --blue: #2346d8; --good: #1d7a46; --bad: #b3261e;
  --sans: "DM Sans", "Helvetica Neue", Arial, sans-serif; --hand: "Caveat", "Segoe Print", cursive; color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--canvas); font-family: var(--sans); color: var(--ink);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
main { max-width: 560px; margin: 0 auto; background: var(--paper); border-radius: 14px; padding: 26px 22px 28px; box-shadow: 0 20px 40px rgba(0,0,0,.12); }
.kind { font-family: var(--hand); color: var(--blue); font-size: 32px; font-weight: 700; margin: 0; line-height: 1; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin: 6px 0 6px; }
.meta { color: var(--grey); font-size: 15px; margin: 0 0 20px; }
.progress { display: flex; gap: 6px; margin: 0 0 18px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: #e3e3de; }
.progress i.on { background: var(--ink); }
.q { font-size: 21px; font-weight: 700; line-height: 1.3; margin: 0 0 16px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; font: inherit; font-size: 18px; line-height: 1.3; padding: 16px 16px; border-radius: 12px; border: 2px solid var(--ink);
  background: #fff; color: var(--ink); cursor: pointer; min-height: 56px; }
.opt:focus-visible, .primary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.opt[aria-pressed="true"] { background: var(--ink); color: #fff; }
.opt.right { border-color: var(--good); background: #e7f4ec; color: var(--ink); }
.opt.wrong { border-color: var(--bad); background: #fbeaea; color: var(--ink); }
.opt:disabled { cursor: default; }
.feedback { margin: 16px 0 0; padding: 14px 16px; border-radius: 12px; background: #f0f2fb; font-size: 17px; line-height: 1.4; }
.feedback b { display: block; margin-bottom: 4px; }
.primary { width: 100%; margin-top: 20px; font: inherit; font-size: 18px; font-weight: 700; padding: 16px; border-radius: 12px; border: 0;
  background: var(--ink); color: #fff; cursor: pointer; min-height: 56px; }
.primary:disabled { background: #b9b9b4; cursor: default; }
.done { text-align: center; padding: 10px 0 4px; }
.done .score { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; margin: 6px 0; }
.done p { font-size: 18px; line-height: 1.45; margin: 8px 0; }
.hand { font-family: var(--hand); color: var(--blue); font-size: 30px; font-weight: 700; }
.err { color: var(--bad); font-size: 15px; margin-top: 12px; }
footer { max-width: 560px; margin: 14px auto 0; text-align: center; color: #55554f; font-size: 13px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<footer>Anonymous. No names or contact details are collected.</footer>
<script src="config.js"></script>
<script src="activities.js"></script>
<script src="live.js"></script>
<script>
(function () {
  const app = document.getElementById("app");
  const p = new URLSearchParams(location.search);
  const id = p.get("a");
  const a = window.ACTIVITIES[id];
  const key = `done:${window.Live.session}:${id}`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  if (!a) {
    app.innerHTML = `<p class="kind">Hmm</p><h1>This link doesn’t open an activity.</h1><p class="meta">Scan the QR code on the screen again.</p>`;
    return;
  }
  document.title = a.title;

  const prior = store.get(key);
  if (prior) { finished(JSON.parse(prior), true); return; }
  a.type === "poll" ? poll() : quiz();

  function poll() {
    let pick = null;
    app.innerHTML = `<p class="kind">Poll</p><h1>${esc(a.question)}</h1><p class="meta">Choose one, then send.</p>
      <div class="opts" role="group" aria-label="Options">${a.options.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>
      <button class="primary" id="send" disabled>Send my answer</button><p class="err" id="err" hidden></p>`;
    app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      pick = +b.dataset.i;
      app.querySelectorAll(".opt").forEach((x) => x.setAttribute("aria-pressed", x === b));
      app.querySelector("#send").disabled = false;
    });
    app.querySelector("#send").onclick = () => submit([pick]);
  }

  function quiz() {
    const answers = [];
    let i = 0;
    render();
    function render() {
      const q = a.questions[i];
      app.innerHTML = `<p class="kind">Quiz</p><h1>${esc(a.title)}</h1>
        <div class="progress" aria-hidden="true">${a.questions.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>
        <p class="meta">Question ${i + 1} of ${a.questions.length}</p>
        <p class="q">${esc(q.q)}</p>
        <div class="opts" role="group" aria-label="Answers">${q.options.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
        <div id="fb"></div>`;
      app.querySelectorAll(".opt").forEach((b) => b.onclick = () => choose(+b.dataset.k));
    }
    function choose(k) {
      const q = a.questions[i];
      answers[i] = k;
      app.querySelectorAll(".opt").forEach((b, j) => {
        b.disabled = true;
        if (j === q.correct) b.classList.add("right");
        else if (j === k) b.classList.add("wrong");
      });
      const ok = k === q.correct, last = i === a.questions.length - 1;
      app.querySelector("#fb").innerHTML = `<div class="feedback"><b>${ok ? "Correct." : "Not quite."}</b>${esc(q.explain)}</div>
        <button class="primary" id="nx">${last ? "Send my answers" : "Next question"}</button><p class="err" id="err" hidden></p>`;
      const nx = app.querySelector("#nx");
      nx.onclick = () => { if (last) submit(answers); else { i++; render(); } };
    }
  }

  async function submit(answers) {
    const btn = app.querySelector(".primary"), err = app.querySelector("#err");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const sent = await window.Live.submit(id, answers);
      const result = { answers, sent };
      store.set(key, JSON.stringify(result));
      finished(result, false);
    } catch (e) {
      console.error(e);
      btn.disabled = false; btn.textContent = "Try again";
      err.hidden = false; err.textContent = "Your answer didn’t send. Check your internet connection and try again.";
    }
  }

  function finished(result, already) {
    const where = result.sent ? "Look at the screen to see everyone’s answers." : "Thanks for taking part.";
    if (a.type === "poll") {
      app.innerHTML = `<div class="done"><p class="kind">Poll</p><h1>${already ? "You’ve already voted." : "Vote sent."}</h1>
        <p>You chose: <b>${esc(a.options[result.answers[0]])}</b></p><p class="hand">${where}</p></div>`;
    } else {
      const score = result.answers.filter((x, k) => x === a.questions[k].correct).length;
      app.innerHTML = `<div class="done"><p class="kind">Quiz</p><h1>${already ? "You’ve already taken this quiz." : "Answers sent."}</h1>
        <p class="score">${score} / ${a.questions.length}</p><p class="hand">${where}</p></div>`;
    }
  }
})();
</script>
</body>
</html>
